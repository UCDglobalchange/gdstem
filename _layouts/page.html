<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  {%- include head.html -%}

  <body>
    {%- include header.html -%}

    {% if page.banner %}
    <div class="hero-banner{% if page.is_home %} hero-home{% endif %}">
      <img src="{{ page.banner | relative_url }}" alt="{{ page.banner_alt | default: page.title }}">

      {% if page.hero_title %}
      <div class="hero-text">
        <h1 class="hero-title">
        {{ page.hero_title }}
        </h1>
        {% if page.hero_subtitle %}
        <p class="hero-subtitle">
        {{ page.hero_subtitle }}
        </p>
        {% endif %}
      </div>
      {% endif %}

    </div>
    {% endif %}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}
  </body>
</html>
